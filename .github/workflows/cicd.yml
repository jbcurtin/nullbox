name: cicd

on:
  push:
    branches: [main, cicd-team]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DOMAIN: ci.example.com
      ADMIN_TOKEN: ci-dummy-token
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build api image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H team-07.fasthacks.cloud >> ~/.ssh/known_hosts

      - name: Push files to the server
        run: |
          rsync -az \
            --exclude '.git' --exclude '.github' --exclude '.env' \
            --exclude 'node_modules' --exclude 'target' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.SSH_USER }}@team-07.fasthacks.cloud:/home/deploy/nullbox/

      - name: Rebuild and restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@team-07.fasthacks.cloud \
            'cd /home/deploy/nullbox && docker compose up -d --build'

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS -o /dev/null https://team-07.fasthacks.cloud && exit 0
            sleep 10
          done
          exit 1
