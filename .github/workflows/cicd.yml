# Test, build and deploy. Every push to main goes live if, and only if, the tests pass.
#
#   test  ─┐
#          ├─> deploy (main only)
#   build ─┘
#
# The images are built here, not on the server (2 vCPUs, slow for Rust), and sent to it
# over SSH. Needs: secret DEPLOY_SSH_KEY, variables DEPLOY_HOST and DEPLOY_USER.
name: cicd

on:
  push:
    branches: [main, cicd]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Frontend tests
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          tags: nullbox-api:latest
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          tags: nullbox-web:latest
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Save both images
        run: docker save nullbox-api:latest nullbox-web:latest | gzip -1 > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          compression-level: 0
          retention-days: 1

  deploy:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One deploy at a time, in push order. Never cancelled halfway.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      SERVER: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Copy the source and the images
        run: |
          # The server keeps a copy of the source, so a manual build there still works.
          git archive HEAD | ssh "$SERVER" 'tar -x -C ~/nullbox'
          ssh "$SERVER" 'docker load' < images.tar.gz
      - name: Restart the stack
        run: ssh "$SERVER" 'cd ~/nullbox && docker compose up -d --no-build && docker image prune -f'
      - name: Check the live site
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS "https://${{ vars.DEPLOY_HOST }}/api/healthz"; then exit 0; fi
            sleep 3
          done
          echo "the site did not come back"; exit 1
