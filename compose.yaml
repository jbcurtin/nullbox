# Production stack. Needs a .env next to this file with DOMAIN and ADMIN_TOKEN (see .env.deploy.example).
services:
  api:
    # CI builds this image and loads it on the server (.github/workflows/cicd.yml).
    # `docker compose up -d --build` still builds it in place.
    image: nullbox-api
    build: { context: ., target: api }
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_WEB_URL: https://${DOMAIN:?set DOMAIN in .env}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      # If set, creating a worker account needs this code. Unset, sign-up is open.
      WORKER_SIGNUP_CODE: ${WORKER_SIGNUP_CODE:-}
      # Optional: without it, the MCP server at /mcp refuses everyone.
      MCP_TOKEN: ${MCP_TOKEN:-}
      # Optional: without it, the shop cannot take payments.
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      # Optional: without an endpoint, no telemetry leaves the server.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    volumes:
      - nullbox-data:/data

  web:
    image: nullbox-web
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nullbox-data:
  caddy-data:
  caddy-config:
