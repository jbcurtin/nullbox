# Production stack. Needs a .env next to this file with DOMAIN and ADMIN_TOKEN (see .env.deploy.example).
services:
  api:
    build: { context: ., target: api }
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_WEB_URL: https://${DOMAIN:?set DOMAIN in .env}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
    volumes:
      - nullbox-data:/data

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [api]
    environment:
      SITE_ADDRESS: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nullbox-data:
  caddy-data:
  caddy-config:
